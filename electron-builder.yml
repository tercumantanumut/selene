# Electron Builder Configuration for Selene
# https://www.electron.build/configuration/configuration

appId: "ai.zlutty.app"
productName: "Selene"
copyright: "Copyright © 2025-2026 Selene"
icon: "build-resources/icon.png"

# Directories
directories:
  buildResources: "build-resources"
  output: "dist-electron"

# Files to include in the asar (only Electron main/preload)
files:
  - "electron-dist/**/*"
  - "package.json"
  - "!**/node_modules/**"
  - "!**/.cache/**"
  - "!**/*.map"

# Extra resources - these stay OUTSIDE the asar archive
extraResources:
  # Window/tray icon fallbacks consumed by Electron at runtime.
  - from: "build-resources/icon.ico"
    to: "icon.ico"
  - from: "build-resources/icon.png"
    to: "icon.png"
  - from: "build-resources/tray-iconTemplate.png"
    to: "tray-iconTemplate.png"
  - from: "build-resources/tray-iconTemplate@2x.png"
    to: "tray-iconTemplate@2x.png"
  # Next.js standalone server (needs to be outside asar to spawn)
  # Note: We explicitly include node_modules as electron-builder excludes it by default
  - from: ".next/standalone"
    to: "standalone"
    filter:
      - "**/*"
      - "!**/node_modules"
      - "!**/models"
      - "!**/models/**"
      - "!**/binaries"
      - "!**/binaries/**"
      - "!**/.local-data"
      - "!**/dist-electron"
      - "!**/.git"
      - "!**/.env*"
      - "!**/drizzle"
      - "!**/.cache"
      # typescript is now needed at runtime by design workspace validation
      - "!**/@huggingface/transformers/node_modules/onnxruntime-node"
      - "!**/@huggingface/transformers/node_modules/onnxruntime-web"
      - "!**/*.map"
      - "!**/*.ts"
      - "!**/test"
      - "!**/tests"
      # Exclude bundled source code (Next.js standalone copies project root)
      - "!**/seline-source"
      - "!**/seline-source/**"
      - "!app"
      - "!app/**"
      - "!components"
      - "!components/**"
      - "!hooks"
      - "!hooks/**"
      - "!i18n"
      - "!i18n/**"
  # Standalone node_modules (explicitly included since it's excluded by default)
  - from: ".next/standalone/node_modules"
    to: "standalone/node_modules"
    filter:
      - "**/*"
      - "!**/.cache/**"
      - "!**/*.map"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      # Dev/build-only packages (also removed in electron-prepare.js as primary defense)
      - "!electron/**"
      # typescript is now needed at runtime (design workspace validation)
  # Turbopack external module wrappers (lives inside .next/node_modules, excluded by the !**/node_modules filter above)
  - from: ".next/standalone/.next/node_modules"
    to: "standalone/.next/node_modules"
    filter:
      - "**/*"
  # Static assets for Next.js
  - from: ".next/static"
    to: "standalone/.next/static"
    filter:
      - "**/*"
  # Public folder (optional - we handle existence in preparation script)
  - from: "public"
    to: "standalone/public"
    filter:
      - "**/*"
  # Local embedding models (optional, bundled outside asar for offline use)
  - from: "models"
    to: "models"
    filter:
      - "**/*"
      - "!**/model_quantized.onnx"
      - "!**/bge-large-en-v1.5/**"
  # Bundled whisper-cli + dylibs for local speech-to-text
  - from: "binaries/whisper"
    to: "binaries/whisper"
    filter:
      - "**/*"
  # Bundled RTK binaries for experimental command token optimization
  - from: "binaries/rtk"
    to: "binaries/rtk"
    filter:
      - "**/*"
      - "!images/**"
      - "!inputs/**"
      - "!**/*.png"
      - "!**/__pycache__/**"
      - "!**/.git/**"
      - "!**/node_modules/**"
      - "!**/.venv/**"
      - "!**/venv/**"
  # Bundled Swift sidecar binary for Phase 1 selene-engine integration
  # (Sprint 7 W7.1.B). The Swift CLI is built upstream by
  # ../swiftapp/scripts/build-swift-engine.sh and copied into
  # binaries/selene-engine/<platform>/ on the build host. At runtime
  # lib/swift-engine/sidecar.ts resolves the binary in this order:
  #   1. explicit override (tests/dev),
  #   2. process.resourcesPath/binaries/selene-engine/<platform>/selene-engine
  #      (this entry — packaged builds),
  #   3. dev-mode .build/release-bundle/<platform>/<arch>/selene-engine.
  # Layout under <Resources>/binaries/selene-engine after install:
  #   macos-arm64/selene-engine          (Apple Silicon)
  #   macos-x64/selene-engine            (Intel)
  #   macos-universal/selene-engine      (preferred for production .dmg)
  #   linux-x64/selene-engine            (when ready)
  #   win32-x64/selene-engine.exe        (when ready)
  # Platform isolation mirrors the binaries/rtk pattern: only the host
  # platform's subdirectory is populated at build time, so the filters
  # below act as a defensive belt-and-suspenders to drop foreign binaries
  # if they happen to exist locally (e.g., a dev who built both arches).
  - from: "binaries/selene-engine"
    to: "binaries/selene-engine"
    filter:
      - "**/*"
      # Keep selene-engine.sha256 and build-manifest.json — the sidecar
      # supervisor surfaces those via SwiftEngineHealth.manifest.
      - "!**/.DS_Store"
      - "!**/__pycache__/**"
      - "!**/.git/**"

# Compression settings
asar: true
compression: "normal"

# Disable npm rebuild - we handle this in electron:rebuild-standalone
npmRebuild: false

# macOS specific configuration
afterSign: "scripts/notarize.js"

mac:
  category: "public.app-category.entertainment"
  # identity: null
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: "build-resources/entitlements.mac.plist"
  entitlementsInherit: "build-resources/entitlements.mac.inherit.plist"
  # Build only for current architecture by default (use CLI flags to override)
  target:
    - target: "dir"
    - target: "dmg"
  extendInfo:
    NSCameraUsageDescription: "This app requires access to your camera for image capture."
    NSMicrophoneUsageDescription: "This app requires access to your microphone for audio capture."
    NSScreenCaptureUsageDescription: "Selene captures your screen to attach screenshots to conversations."
    NSUserNotificationAlertStyle: "alert"

# Windows specific configuration
win:
  icon: "build-resources/icon.ico"
  signAndEditExecutable: true
  forceCodeSigning: false
  target:
    - target: "nsis"
    - target: "portable"
  legalTrademarks: "Selene is a trademark of Selene"

# NSIS installer settings
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "build-resources/icon.ico"
  uninstallerIcon: "build-resources/icon.ico"
  installerHeaderIcon: "build-resources/icon.ico"
  shortcutName: "Selene"
  artifactName: "${productName}-Setup-${version}.${ext}"
  uninstallDisplayName: "Selene"
  deleteAppDataOnUninstall: false

# DMG settings for macOS
dmg:
  title: "Selene"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"
  window:
    width: 540
    height: 380


# Publish configuration (for auto-updates)
# publish:
#   provider: "github"
#   owner: "your-github-username"
#   repo: "styly-agent"

# Protocol registration (for deep linking)
protocols:
  - name: "zlutty"
    schemes:
      - "zlutty"
